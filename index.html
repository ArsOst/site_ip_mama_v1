<!DOCTYPE html>
<!-- Сообщает браузеру, что это современный HTML5. Менять не нужно. -->
<html lang="ru">
<!-- lang="ru" — язык страницы русский. Важно для поисковиков. -->
<head>
    <meta charset="UTF-8">
    <!-- Кодировка UTF-8. Без неё русский текст станет "кракозябрами". Не менять. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Делает сайт адаптивным под мобильные: страница не уменьшается, а подстраивается под ширину экрана. -->
    <title>Кадастровый инженер</title>
    <!-- Текст во вкладке браузера. Можете менять. -->
</head>
<body>
    <!-- Всё, что ниже, видно на странице. Меняйте только текст внутри тегов. -->

    <h1>Сайт для маминого ИП</h1>
    <!-- h1 — главный заголовок. Замените "Заголовок" на свой текст. -->

    <p>Создан сыночкой-корзиночкой</p>
    <!-- p — абзац. Замените "Абзац" на свой текст. Для нового абзаца добавьте ещё одну пару <p>...</p>. -->

</body>
</html>
